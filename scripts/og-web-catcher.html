  .brand-mark { width: 56px; height: 56px; }

  .brand-name { font-size: 22px; }
  .brand-sub { font-size: 15px; }

  .body { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 44px; padding: 0 56px; }

  .kind { align-self: flex-start; padding: 4px 10px; border: 1.5px solid #121211; font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  .sub { margin: 0; font-size: 25px; line-height: 1.35; color: #4A4A45; max-width: 26ch; }
  .shot { flex: none; width: 528px; height: 352px; border: 2px solid #121211; background: #fff; box-shadow: 10px 10px 0 #121211; }
  .shot svg { display: block; }
  .foot { height: 64px; background: #121211; color: #F1F1EE; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  .foot i { display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 50%; background: #FF4F00; vertical-align: 1px; }
