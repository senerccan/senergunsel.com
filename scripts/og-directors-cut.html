<!doctype html>
<!-- Template for /assets/img/og-directors-cut.png (1200x630), the social card for the Director's Cut (201). Rendered by scripts/render-images.py like og-card.html. The drawing is the ground floor plan from the home page, captured by render-images.py and served to this template at /__og-src/floor-plan.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F1F1EE; }
  .card { position: relative; width: 1200px; height: 630px; display: flex; flex-direction: column; color: #121211; font-family: var(--sans); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 40px 56px 0; }
  .brand { gap: 16px; }
  .brand-mark { width: 56px; height: 56px; }
  .brand-mark svg { width: 24px; height: 45px; }
  .brand-name { font-size: 22px; }
  .brand-sub { font-size: 15px; }
  .tools { font-family: var(--mono); font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
  .body { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 44px; padding: 0 56px; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .kind { align-self: flex-start; padding: 4px 10px; border: 1.5px solid #121211; font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 74px; line-height: 0.98; font-weight: 800; letter-spacing: -0.04em; }
  .sub { margin: 0; font-size: 25px; line-height: 1.35; color: #4A4A45; max-width: 26ch; }
  .shot { flex: none; width: 528px; height: 352px; border: 2px solid #121211; background: #fff; box-shadow: 10px 10px 0 #121211; }
  .shot svg { display: block; }
  .foot { height: 64px; background: #121211; color: #F1F1EE; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  .foot i { display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 50%; background: #FF4F00; vertical-align: 1px; }
  .foot b { font-family: var(--sans); text-transform: none; letter-spacing: 0.01em; font-size: 22px; }

  .shot { width: 440px; height: 362px; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; background: #F1F1EE; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: contain; }
  h1, .sub { text-wrap: balance; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="brand">
      <span class="brand-mark"><svg viewBox="0 0 42 80"><g transform="rotate(24 21 24)"><line x1="21" y1="24" x2="21" y2="44" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/></g><g transform="rotate(-22 19 46)"><line x1="19" y1="46" x2="19" y2="74" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><rect x="14" y="72.5" width="14" height="7" rx="3.5" style="fill:#FF4F00"/></g><line x1="21.5" y1="18" x2="19" y2="47" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/><g transform="rotate(22 19 46)"><line x1="19" y1="46" x2="19" y2="74" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><rect x="14" y="72.5" width="14" height="7" rx="3.5" style="fill:#FF4F00"/></g><g transform="rotate(-24 21 24)"><line x1="21" y1="24" x2="21" y2="44" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/></g><circle cx="22" cy="9" r="7.5" fill="currentColor"/><rect x="22" y="6.2" width="10" height="3.4" rx="1.2" style="fill:#FF4F00"/></svg></span>
      <span class="brand-text"><span class="brand-name">Sener Can Gunsel</span><span class="brand-sub">201 · Notice board · Flagship Store 001</span></span>
    </span>
    <span class="tools">HTML · CSS · JavaScript</span>
  </div>
  <div class="body">
    <div class="text">
      <span class="kind">Field notes</span>
      <h1>Director&rsquo;s Cut</h1>
      <p class="sub">How this store was built: the brief, the decisions, the dead ends and what got cut.</p>
    </div>
    <div class="shot"><img src="/__og-src/floor-plan.png" alt=""></div>
  </div>
  <div class="foot"><span><i></i>5 min read · How the site was built</span><b>senergunsel.com</b></div>
</div>
</body>
</html>
